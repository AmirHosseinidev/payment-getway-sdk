<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت آزمایشی</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-2">درگاه پرداخت</h1>
        <p class="text-center text-slate-500 mb-8">پرداخت آزمایشی SDK</p>

        <div class="space-y-4 mb-8">
            <div class="flex justify-between">
                <span class="text-slate-500">مبلغ پرداخت:</span>
                <strong id="amount">در حال دریافت...</strong>
            </div>

            <div class="flex justify-between">
                <span class="text-slate-500">شماره سفارش:</span>
                <strong id="orderId">---</strong>
            </div>

            <div class="flex justify-between">
                <span class="text-slate-500">وضعیت:</span>
                <strong id="status" class="text-amber-500">در انتظار پرداخت</strong>
            </div>
        </div>

        <div id="message" class="text-center text-sm mb-4"></div>

        <div class="space-y-3">
            <button id="successBtn" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl">
                پرداخت موفق
            </button>

            <button id="failBtn" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl">
                پرداخت ناموفق
            </button>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:3000';

        const authority = window.location.pathname.split('/').pop();

        const amountElement = document.querySelector('#amount');
        const orderIdElement = document.querySelector('#orderId');
        const statusElement = document.querySelector('#status');
        const messageElement = document.querySelector('#message');

        const successBtn = document.querySelector('#successBtn');
        const failBtn = document.querySelector('#failBtn');

        async function loadPayment() {
            try {
                const response = await fetch(`${API_URL}/payments/${authority}`);

                if (!response.ok) {
                    throw new Error('Payment not found');
                }

                const payment = await response.json();

                amountElement.textContent =
                    payment.amount.toLocaleString('fa-IR') + ' تومان';

                orderIdElement.textContent = payment.orderId;

                statusElement.textContent = payment.status;

                if (payment.status !== 'PENDING') {
                    successBtn.disabled = true;
                    failBtn.disabled = true;
                }

            } catch (error) {
                messageElement.textContent = 'خطا در دریافت اطلاعات پرداخت';
                messageElement.className = 'text-center text-sm mb-4 text-red-600';
            }
        }

        async function processPayment(success) {
            successBtn.disabled = true;
            failBtn.disabled = true;

            try {
                const response = await fetch(
                    `${API_URL}/payments/${authority}/simulate`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ success })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Payment failed');
                }

                messageElement.textContent = 'نتیجه پرداخت ثبت شد';
                messageElement.className =
                    'text-center text-sm mb-4 text-green-600';

                window.location.href =
                    `/callback?authority=${authority}`;

            } catch (error) {
                messageElement.textContent = error.message;
                messageElement.className =
                    'text-center text-sm mb-4 text-red-600';

                successBtn.disabled = false;
                failBtn.disabled = false;
            }
        }

        successBtn.addEventListener('click', () => processPayment(true));

        failBtn.addEventListener('click', () => processPayment(false));

        loadPayment();
    </script>

</body>

</html>
