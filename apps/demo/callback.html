
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتیجه پرداخت</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 text-center">
    <div id="icon" class="text-5xl mb-4">⏳</div>

    <h1 class="text-2xl font-bold mb-3">نتیجه پرداخت</h1>

    <p id="message" class="text-slate-500 mb-6">
      در حال بررسی پرداخت...
    </p>

    <div class="bg-slate-50 rounded-xl p-4 text-right space-y-3">
      <div class="flex justify-between">
        <span>شماره سفارش:</span>
        <strong id="orderId">---</strong>
      </div>

      <div class="flex justify-between">
        <span>مبلغ:</span>
        <strong id="amount">---</strong>
      </div>

      <div class="flex justify-between">
        <span>وضعیت:</span>
        <strong id="status">---</strong>
      </div>

      <div class="flex justify-between">
        <span>Authority:</span>
        <strong id="authority" class="text-xs break-all"></strong>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000';

    const params = new URLSearchParams(window.location.search);
    const authority = params.get('authority');

    async function loadResult() {
      if (!authority) {
        document.querySelector('#message').textContent =
          'کد پرداخت وجود ندارد';
        return;
      }

      try {
        const response = await fetch(
          `${API_URL}/payments/${authority}`
        );

        if (!response.ok) {
          throw new Error('Payment not found');
        }

        const payment = await response.json();

        document.querySelector('#orderId').textContent =
          payment.orderId;

        document.querySelector('#amount').textContent =
          payment.amount.toLocaleString('fa-IR') + ' تومان';

        document.querySelector('#status').textContent =
          payment.status;

        document.querySelector('#authority').textContent =
          payment.authority;

        if (payment.status === 'SUCCESS') {
          document.querySelector('#icon').textContent = '✅';
          document.querySelector('#message').textContent =
            'پرداخت شما با موفقیت انجام شد';
          document.querySelector('#status').className =
            'text-green-600 font-bold';

        } else if (payment.status === 'FAILED') {
          document.querySelector('#icon').textContent = '❌';
          document.querySelector('#message').textContent =
            'پرداخت ناموفق بود';

          document.querySelector('#status').className =
            'text-red-600 font-bold';

        } else {
          document.querySelector('#icon').textContent = '⏳';
          document.querySelector('#message').textContent =
            'پرداخت هنوز تکمیل نشده است';
        }

      } catch (error) {
        document.querySelector('#message').textContent =
          'خطا در دریافت نتیجه پرداخت';
      }
    }

    loadResult();
  </script>

</body>
</html>
